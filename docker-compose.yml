services:
  postgres:
    image: postgres:17-alpine
    container_name: sentinelpr-postgres
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinelpr
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelpr"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sentinelpr-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: sentinelpr-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot bucket creation for MinIO
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/sentinelpr &&
      echo 'Bucket sentinelpr ready'"

  # ── Full application stack (opt-in): docker compose --profile app up -d ──
  # Bare `docker compose up -d` still starts only the infrastructure above.
  migrate:
    build: .
    profiles: ["app"]
    container_name: sentinelpr-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinelpr?schema=public
    command: ["pnpm", "db:migrate"]

  app:
    build: .
    profiles: ["app"]
    container_name: sentinelpr-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinelpr?schema=public
      REDIS_URL: redis://redis:6379
      DASHBOARD_URL: http://localhost:3000
      ARTIFACT_DRIVER: local
      ARTIFACT_LOCAL_DIR: /app/.data/artifacts
    env_file:
      - path: .env
        required: false
    ports:
      - "3000:3000"
    volumes:
      - app-artifacts:/app/.data/artifacts
    restart: unless-stopped

  worker-review:
    build: .
    profiles: ["app"]
    container_name: sentinelpr-worker-review
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinelpr?schema=public
      REDIS_URL: redis://redis:6379
      DASHBOARD_URL: http://localhost:3000
      ARTIFACT_DRIVER: local
      ARTIFACT_LOCAL_DIR: /app/.data/artifacts
    env_file:
      - path: .env
        required: false
    command: ["pnpm", "worker:review"]
    volumes:
      - app-artifacts:/app/.data/artifacts
    restart: unless-stopped

  worker-visual:
    build: .
    profiles: ["app"]
    container_name: sentinelpr-worker-visual
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinelpr?schema=public
      REDIS_URL: redis://redis:6379
      DASHBOARD_URL: http://localhost:3000
      ARTIFACT_DRIVER: local
      ARTIFACT_LOCAL_DIR: /app/.data/artifacts
    env_file:
      - path: .env
        required: false
    command: ["pnpm", "worker:visual"]
    volumes:
      - app-artifacts:/app/.data/artifacts
    restart: unless-stopped

  worker-synthetic:
    build: .
    profiles: ["app"]
    container_name: sentinelpr-worker-synthetic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinelpr?schema=public
      REDIS_URL: redis://redis:6379
      DASHBOARD_URL: http://localhost:3000
      ARTIFACT_DRIVER: local
      ARTIFACT_LOCAL_DIR: /app/.data/artifacts
    env_file:
      - path: .env
        required: false
    command: ["pnpm", "worker:synthetic"]
    volumes:
      - app-artifacts:/app/.data/artifacts
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  app-artifacts:
