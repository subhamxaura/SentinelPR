name: Release

# Publishes the production image to GHCR when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Re-verify the exact tagged commit, including PostgreSQL migrations and
  # database-backed invariants, before anything is published.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinelpr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinelpr?schema=public
    steps:
      - uses: actions/checkout@v4

      # No `version` input: the action reads packageManager from package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply database schema
        run: pnpm db:migrate

      - name: Database-backed concurrency tests
        run: RUN_DB_INTEGRATION=1 pnpm test:integration

      - name: Build dashboard
        env:
          AUTH_GITHUB_CLIENT_ID: ci-placeholder
          AUTH_GITHUB_CLIENT_SECRET: ci-placeholder
          AUTH_STATE_SECRET: ci-only-not-a-secret
          ARTIFACT_TOKEN_SECRET: ci-only-not-a-secret
          GITHUB_INSTALLATION_SECRET: ci-only-not-a-secret
        run: pnpm build

  publish:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          # v1.2.3 → tags: 1.2.3, 1.2, 1, latest; v1.2.3-rc.1 → 1.2.3-rc.1 only
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=match,pattern=v(.*),group=1
          labels: |
            org.opencontainers.image.title=SentinelPR
            org.opencontainers.image.description=Autonomous PR review, visual regression & synthetic monitoring platform
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
