name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinelpr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinelpr?schema=public
      REDIS_URL: redis://localhost:6379
      ARTIFACT_DRIVER: local
      ARTIFACT_LOCAL_DIR: .data/artifacts
      DASHBOARD_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      # No `version` input: the action reads packageManager from package.json,
      # keeping CI on exactly the pinned pnpm release.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply database schema
        run: pnpm db:migrate

      - name: Build dashboard
        run: pnpm build
